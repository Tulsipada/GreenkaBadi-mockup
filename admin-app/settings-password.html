<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin App - Change password - Green Kabadi</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/app-shell.css" />
  <link rel="stylesheet" href="../shared/components.css" />
  <link rel="stylesheet" href="../shared/card-app.css" />
</head>
<body>
  <div class="phone-stage">
    <div class="phone-frame">
      <div class="phone-notch">9:41</div>
      <div class="Screen">
        <header class="Header">
          <a class="HeaderBack" href="settings.html" aria-label="Back">&lsaquo;</a>
          <div class="grow"><h1 class="HeaderTitle">Change password</h1></div>
        </header>
        <div class="ScreenScroll">
          <form class="stack" id="form">
            <div class="Field">
              <label for="current">Current password</label>
              <input id="current" type="password" required />
            </div>
            <div class="Field">
              <label for="next">New password</label>
              <input id="next" type="password" required minlength="8" />
            </div>
            <div class="Field">
              <label for="confirm">Confirm new password</label>
              <input id="confirm" type="password" required minlength="8" />
            </div>
            <button class="Btn Btn-primary Btn-block" type="submit">Update password</button>
          </form>
        </div>
      </div>
    </div>
  </div>
  <script>
    document.getElementById("form").addEventListener("submit", function (e) {
      e.preventDefault();
      location.href = "settings.html";
    });
  </script>
</body>
</html>
