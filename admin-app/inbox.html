<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin App - Inbox - Green Kabadi</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/app-shell.css" />
  <link rel="stylesheet" href="../shared/components.css" />
  <link rel="stylesheet" href="../shared/card-app.css" />
  <link rel="stylesheet" href="admin-app.css" />
</head>
<body>
  <div class="phone-stage">
    <div class="phone-frame feed-page">
      <div class="phone-notch">9:41</div>
      <div class="Screen">
        <header class="Header">
          <div class="Header-left">
            <div style="min-width:0;">
              <h1 class="HeaderTitle">Inbox</h1>
              <span class="HeaderSub">Pending requests</span>
            </div>
          </div>
          <div class="Header-right">
            <a class="HeaderIcon" href="notifications.html" title="Notifications" aria-label="Notifications">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 7 3 7 3 7H3s3 0 3-7"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
              <span class="badge" data-badge="notif">2</span>
            </a>
          </div>
        </header>
        <div class="ScreenScroll pad-tab">
          <div class="feed-toolbar">
            <label class="SearchField SearchField-soft">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input type="search" id="search" placeholder="Search customer, area, item…" autocomplete="off" />
            </label>
          </div>
          <div class="JobFeed" id="list"></div>
          <p class="ListEmptyHint" id="empty" hidden>No pending requests.</p>
        </div>
        <nav class="Footer">
          <a class="active" href="inbox.html">
            <span class="ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7A2.5 2.5 0 0 1 17.5 16H9l-5 4V6.5z"/></svg>
              <span class="tab-badge" data-badge="inbox">3</span>
            </span>
            Inbox
          </a>
          <a href="transactions.html"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h10"/><circle cx="18" cy="17" r="2.5"/></svg></span>Txns</a>
          <a href="more.html"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></span>More</a>
          <a href="profile.html"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.25"/><path d="M5.5 19.5c1.6-3.2 4-4.75 6.5-4.75s4.9 1.55 6.5 4.75"/></svg></span>Profile</a>
        </nav>
      </div>
    </div>
  </div>
  <script src="chrome.js"></script>
  <script>
    var KEY = "gk_admin_inbox";
    var defaults = [
      { id: "i1", title: "Old fridge", meta: "Electronics · ~40 kg", customer: "Rina Sharma", area: "Salt Lake Sec 2", status: "Waiting" },
      { id: "i2", title: "Paper cartons", meta: "Paper · ~15 kg", customer: "Amit Das", area: "Champasari", status: "Waiting" },
      { id: "i3", title: "Copper wire", meta: "Metal · ~8 kg", customer: "Priya", area: "Bidhannagar", status: "Waiting" }
    ];
    function load() {
      try {
        var saved = JSON.parse(localStorage.getItem(KEY) || "null");
        if (saved) return saved;
      } catch (e) {}
      try { localStorage.setItem(KEY, JSON.stringify(defaults)); } catch (e2) {}
      return defaults.slice();
    }
    var items = load();
    try { localStorage.setItem("gk_admin_inbox_pending", String(items.length)); } catch (e3) {}
    if (window.GK_ADMIN_APP) GK_ADMIN_APP.refresh();

    var list = document.getElementById("list");
    var empty = document.getElementById("empty");
    var search = document.getElementById("search");
    var chevron =
      '<span class="JobGo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span>';

    function render() {
      var q = (search.value || "").toLowerCase().trim();
      list.innerHTML = "";
      var shown = 0;
      items.forEach(function (r) {
        var hay = (r.title + " " + r.customer + " " + r.area + " " + r.meta).toLowerCase();
        if (q && hay.indexOf(q) < 0) return;
        shown++;
        var a = document.createElement("a");
        a.className = "JobRow";
        a.href = "assign.html?id=" + encodeURIComponent(r.id);
        a.innerHTML =
          '<div class="JobMain">' +
          '<div class="JobKicker"><span class="JobStatus is-waiting">' +
          (r.status || "Waiting") +
          "</span></div>" +
          "<h3>" +
          r.title +
          "</h3>" +
          "<p>" +
          r.customer +
          " · " +
          r.area +
          "</p>" +
          "<p>" +
          r.meta +
          "</p>" +
          "</div>" +
          chevron;
        list.appendChild(a);
      });
      empty.hidden = shown > 0;
      empty.textContent = q ? "No requests match your search." : "No pending requests.";
    }
    search.addEventListener("input", render);
    render();
  </script>
</body>
</html>
