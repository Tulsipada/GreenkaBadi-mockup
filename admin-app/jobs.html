<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin App - Jobs - Green Kabadi</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/app-shell.css" />
  <link rel="stylesheet" href="../shared/components.css" />
  <link rel="stylesheet" href="../shared/card-app.css" />
  <link rel="stylesheet" href="admin-app.css" />
</head>
<body>
  <div class="phone-stage">
    <div class="phone-frame feed-page">
      <div class="phone-notch">9:41</div>
      <div class="Screen">
        <header class="Header">
          <div class="Header-left">
            <div style="min-width:0;">
              <h1 class="HeaderTitle">Jobs</h1>
              <span class="HeaderSub">All pickups</span>
            </div>
          </div>
        </header>
        <div class="ScreenScroll pad-tab">
          <div class="feed-toolbar">
            <div class="SegControl" id="tabs" role="tablist">
              <button class="seg active" type="button" data-tab="active" role="tab">Active<span class="count" id="countActive">0</span></button>
              <button class="seg" type="button" data-tab="done" role="tab">Done<span class="count" id="countDone">0</span></button>
            </div>
            <label class="SearchField SearchField-soft">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input type="search" id="search" placeholder="Search customer, area, item…" autocomplete="off" />
            </label>
          </div>
          <div class="JobFeed" id="list"></div>
          <p class="ListEmptyHint" id="empty" hidden>No jobs match.</p>
        </div>
        <nav class="Footer">
          <a href="inbox.html">
            <span class="ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7A2.5 2.5 0 0 1 17.5 16H9l-5 4V6.5z"/></svg>
              <span class="tab-badge" data-badge="inbox">3</span>
            </span>
            Inbox
          </a>
          <a class="active" href="jobs.html"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h4"/></svg></span>Jobs</a>
          <a href="transactions.html"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h10"/><circle cx="18" cy="17" r="2.5"/></svg></span>Txns</a>
          <a href="more.html"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></span>More</a>
        </nav>
      </div>
    </div>
  </div>
  <script src="../admin/jobs-data.js"></script>
  <script src="chrome.js"></script>
  <script>
    var jobs = GK_ADMIN_JOBS.load();
    var tab = "active";
    var list = document.getElementById("list");
    var empty = document.getElementById("empty");
    var search = document.getElementById("search");
    var chevron =
      '<span class="JobGo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span>';

    function syncCounts() {
      document.getElementById("countActive").textContent = String(
        jobs.filter(function (j) { return j.tab === "active"; }).length
      );
      document.getElementById("countDone").textContent = String(
        jobs.filter(function (j) { return j.tab === "done"; }).length
      );
    }

    function render() {
      var q = (search.value || "").toLowerCase().trim();
      list.innerHTML = "";
      var shown = 0;
      jobs.forEach(function (j) {
        if (j.tab !== tab) return;
        var hay = [j.title, j.customer, j.area, j.collector, j.meta, j.orderId]
          .join(" ")
          .toLowerCase();
        if (q && hay.indexOf(q) < 0) return;
        shown++;
        var a = document.createElement("a");
        a.className = "JobRow";
        a.href =
          j.status === "waiting"
            ? "assign.html?id=" + encodeURIComponent(j.id)
            : j.status === "completed"
              ? "transaction-edit.html?id=" + encodeURIComponent(j.orderId)
              : "assign.html?id=" + encodeURIComponent(j.id);
        var who = j.collector
          ? j.customer + " · " + j.collector
          : j.customer + " · Unassigned";
        a.innerHTML =
          '<div class="JobMain">' +
          '<div class="JobKicker">' +
          '<span class="JobStatus is-' +
          j.status +
          '">' +
          j.statusLabel +
          "</span>" +
          '<span class="JobOid">' +
          GK_ADMIN_JOBS.short(j.orderId) +
          "</span></div>" +
          "<h3>" +
          j.title +
          "</h3>" +
          "<p>" +
          who +
          "</p>" +
          "<p>" +
          j.area +
          (j.meta ? " · " + j.meta : "") +
          "</p>" +
          "</div>" +
          chevron;
        list.appendChild(a);
      });
      empty.hidden = shown > 0;
      empty.textContent = q
        ? "No jobs match your search."
        : tab === "active"
          ? "No active jobs."
          : "No completed jobs yet.";
      syncCounts();
    }

    document.getElementById("tabs").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-tab]");
      if (!btn) return;
      tab = btn.getAttribute("data-tab");
      document.querySelectorAll("#tabs .seg").forEach(function (b) {
        b.classList.toggle("active", b === btn);
        b.setAttribute("aria-selected", b === btn ? "true" : "false");
      });
      render();
    });
    search.addEventListener("input", render);
    render();
  </script>
</body>
</html>
