<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin App - Organisation - Green Kabadi</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/app-shell.css" />
  <link rel="stylesheet" href="../shared/components.css" />
  <link rel="stylesheet" href="../shared/card-app.css" />
</head>
<body>
  <div class="phone-stage">
    <div class="phone-frame">
      <div class="phone-notch">9:41</div>
      <div class="Screen">
        <header class="Header">
          <a class="HeaderBack" href="settings.html" aria-label="Back">&lsaquo;</a>
          <div class="grow"><h1 class="HeaderTitle">Organisation</h1></div>
        </header>
        <div class="ScreenScroll">
          <form class="stack" id="form">
            <div class="Field">
              <label for="name">Organisation name</label>
              <input id="name" type="text" required value="Greenkabadi" />
            </div>
            <div class="Field">
              <label for="address">Address</label>
              <textarea id="address" rows="3">Milanmore, Maheshmari, Champasari, Siliguri, West Bengal</textarea>
            </div>
            <button class="Btn Btn-primary Btn-block" type="submit">Save</button>
          </form>
        </div>
      </div>
    </div>
  </div>
  <script>
    try {
      var org = JSON.parse(localStorage.getItem("gk_admin_org") || "null");
      if (org) {
        if (org.name) document.getElementById("name").value = org.name;
        if (org.address) document.getElementById("address").value = org.address;
      }
    } catch (e) {}
    document.getElementById("form").addEventListener("submit", function (e) {
      e.preventDefault();
      try {
        localStorage.setItem("gk_admin_org", JSON.stringify({
          name: document.getElementById("name").value.trim(),
          address: document.getElementById("address").value.trim()
        }));
      } catch (ex) {}
      location.href = "settings.html";
    });
  </script>
</body>
</html>
