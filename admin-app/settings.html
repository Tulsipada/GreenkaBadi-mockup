<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin App - Settings - Green Kabadi</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/app-shell.css" />
  <link rel="stylesheet" href="../shared/components.css" />
  <link rel="stylesheet" href="../shared/card-app.css" />
  <link rel="stylesheet" href="admin-app.css" />
  <style>
    .notif-toggle {
      width: 44px; height: 26px; border-radius: 999px; border: none;
      background: var(--gk-green-700); position: relative; cursor: pointer; padding: 0; flex-shrink: 0;
    }
    .notif-toggle::after {
      content: ""; position: absolute; top: 3px; left: 22px; width: 20px; height: 20px;
      border-radius: 50%; background: #fff; transition: left 0.15s ease;
    }
    .notif-toggle.off { background: #c5cfc9; }
    .notif-toggle.off::after { left: 3px; }
  </style>
</head>
<body>
  <div class="phone-stage">
    <div class="phone-frame">
      <div class="phone-notch">9:41</div>
      <div class="Screen">
        <header class="Header">
          <a class="HeaderBack" href="more.html" aria-label="Back">&lsaquo;</a>
          <div class="grow">
            <h1 class="HeaderTitle">Settings</h1>
          </div>
        </header>
        <div class="ScreenScroll">
          <div class="SettingsGroup">
            <a class="SettingsRow" href="settings-language.html">
              <span class="SettingsIco" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg></span>
              <span class="grow">Language<br /><span class="hint">App display language</span></span>
              <span class="chev" id="langHint">EN</span>
            </a>
            <a class="SettingsRow" href="settings-organisation.html">
              <span class="SettingsIco" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V8l7-4 7 4v13"/><path d="M9 21v-6h6v6"/></svg></span>
              <span class="grow">Organisation<br /><span class="hint" id="orgHint">Greenkabadi</span></span>
              <span class="chev">›</span>
            </a>
            <div class="SettingsRow">
              <span class="SettingsIco" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1 1 12 0c0 7 3 7 3 7H3s3 0 3-7"/><path d="M10 19a2 2 0 0 0 4 0"/></svg></span>
              <span class="grow">Email alerts<br /><span class="hint">New contact &amp; pickup alerts</span></span>
              <button type="button" class="notif-toggle" id="notifToggle" aria-label="Toggle email alerts" aria-pressed="true"></button>
            </div>
            <a class="SettingsRow" href="settings-support.html">
              <span class="SettingsIco" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v2a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1A19.5 19.5 0 0 1 5.2 9.9 19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h2a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.6a2 2 0 0 1-.5 2.1L7.1 9.9a16 16 0 0 0 6 6l1.5-1.1a2 2 0 0 1 2.1-.5c.8.3 1.7.5 2.6.6a2 2 0 0 1 1.7 2z"/></svg></span>
              <span class="grow">Support contact<br /><span class="hint" id="supportHint">support@greenkabadi.in</span></span>
              <span class="chev">›</span>
            </a>
            <a class="SettingsRow" href="settings-password.html">
              <span class="SettingsIco" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
              <span class="grow">Change password<br /><span class="hint">Admin login security</span></span>
              <span class="chev">›</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    try {
      var org = JSON.parse(localStorage.getItem("gk_admin_org") || "null");
      if (org && org.name) document.getElementById("orgHint").textContent = org.name;
      var support = JSON.parse(localStorage.getItem("gk_admin_support") || "null");
      if (support && support.email) document.getElementById("supportHint").textContent = support.email;
      var lang = localStorage.getItem("gk_lang") || "en";
      document.getElementById("langHint").textContent = { en: "EN", hi: "हिं", bn: "বাং" }[lang] || "EN";
    } catch (e) {}
    var t = document.getElementById("notifToggle");
    t.addEventListener("click", function () {
      t.classList.toggle("off");
      t.setAttribute("aria-pressed", t.classList.contains("off") ? "false" : "true");
    });
  </script>
</body>
</html>
