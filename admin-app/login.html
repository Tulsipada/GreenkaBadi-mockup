<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin App - Login - Green Kabadi</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/app-shell.css" />
  <link rel="stylesheet" href="../shared/components.css" />
  <link rel="stylesheet" href="../shared/card-app.css" />
</head>
<body>
  <div class="phone-stage">
    <div class="phone-frame">
      <div class="phone-notch">9:41</div>
      <div class="Screen">
        <div class="auth-wrap">
          <div class="auth-brand">
            <img src="../assets/logo.png" alt="Green Kabadi" />
            <p class="muted">Admin app · Company account</p>
          </div>
          <div class="Field">
            <label>Email</label>
            <input type="email" placeholder="admin@greenkabadi.com" />
          </div>
          <div class="Field">
            <label>Password</label>
            <input type="password" placeholder="••••••••" />
          </div>
          <a class="Btn Btn-primary Btn-block" href="inbox.html">Log in</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
