<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin App - Assign - Green Kabadi</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/app-shell.css" />
  <link rel="stylesheet" href="../shared/components.css" />
  <link rel="stylesheet" href="../shared/card-app.css" />
  <link rel="stylesheet" href="admin-app.css" />
</head>
<body>
  <div class="phone-stage">
    <div class="phone-frame">
      <div class="phone-notch">9:41</div>
      <div class="Screen">
        <header class="Header">
          <a class="HeaderBack" href="inbox.html" aria-label="Back">&lsaquo;</a>
          <div class="grow">
            <h1 class="HeaderTitle">Assign collector</h1>
            <span class="HeaderSub">Pick an active staff</span>
          </div>
        </header>
        <div class="ScreenScroll">
          <div class="Card" id="reqCard">
            <h3 style="margin:0 0 4px;">Old fridge</h3>
            <p class="muted" style="margin:0;">Rina Sharma · Salt Lake Sec 2 · Electronics · ~40 kg</p>
          </div>
          <p class="muted" style="font-size:12px;font-weight:700;margin:4px 0 0;">Active collectors</p>
          <div id="collectorList" class="stack" style="gap:10px;">
            <label class="Card CardRow" style="cursor:pointer;align-items:center;">
              <input type="radio" name="c" checked />
              <div class="CardThumb" style="border-radius:999px;width:44px;height:44px;font-size:16px;">K</div>
              <div class="CardBody"><h3>Karim</h3><p>Active · 2 jobs today</p></div>
              <span class="Chip Chip-done">Available</span>
            </label>
            <label class="Card CardRow" style="cursor:pointer;align-items:center;">
              <input type="radio" name="c" />
              <div class="CardThumb" style="border-radius:999px;width:44px;height:44px;font-size:16px;">S</div>
              <div class="CardBody"><h3>Suman</h3><p>Active · 1 job today</p></div>
              <span class="Chip Chip-done">Available</span>
            </label>
          </div>
          <a class="Btn Btn-primary Btn-block" href="#" id="confirmBtn">Confirm assign</a>
        </div>
      </div>
    </div>
  </div>
  <script>
    var params = new URLSearchParams(location.search);
    var reqId = params.get("id");
    try {
      var inbox = JSON.parse(localStorage.getItem("gk_admin_inbox") || "null");
      if (inbox && reqId) {
        var found = inbox.find(function (r) { return r.id === reqId; });
        if (found) {
          var card = document.getElementById("reqCard");
          card.querySelector("h3").textContent = found.title;
          card.querySelector("p").textContent =
            found.customer + " · " + found.area + " · " + found.meta;
        }
      }
    } catch (e0) {}
    try {
      var staff = JSON.parse(localStorage.getItem("gk_admin_staff") || "null");
      if (staff && staff.length) {
        var list = document.getElementById("collectorList");
        list.innerHTML = "";
        var active = staff.filter(function (s) {
          return (s.status || "Active") === "Active";
        });
        if (!active.length) {
          list.innerHTML = '<p class="muted" style="margin:0;">No active collectors. Activate staff from Staffs.</p>';
        } else {
          active.forEach(function (s, i) {
            var initial = (s.name || "?").charAt(0).toUpperCase();
            var jobs = Number(s.jobs) || 0;
            var jobsTxt = jobs === 1 ? "1 job today" : jobs + " jobs today";
            var label = document.createElement("label");
            label.className = "Card CardRow";
            label.style.cssText = "cursor:pointer;align-items:center;";
            label.innerHTML =
              '<input type="radio" name="c"' + (i === 0 ? " checked" : "") + " />" +
              '<div class="CardThumb" style="border-radius:999px;width:44px;height:44px;font-size:16px;">' +
              initial +
              "</div>" +
              '<div class="CardBody"><h3>' +
              s.name +
              "</h3><p>Active · " +
              jobsTxt +
              "</p></div>" +
              '<span class="Chip Chip-done">Available</span>';
            list.appendChild(label);
          });
        }
      }
    } catch (e) {}
    document.getElementById("confirmBtn").addEventListener("click", function (e) {
      e.preventDefault();
      try {
        var items = JSON.parse(localStorage.getItem("gk_admin_inbox") || "[]");
        if (reqId) items = items.filter(function (r) { return r.id !== reqId; });
        else if (items.length) items.shift();
        localStorage.setItem("gk_admin_inbox", JSON.stringify(items));
        localStorage.setItem("gk_admin_inbox_pending", String(items.length));
      } catch (ex) {}
      location.href = "inbox.html";
    });
  </script>
</body>
</html>
