<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customer - Settings - Green Kabadi</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/app-shell.css" />
  <link rel="stylesheet" href="../shared/components.css" />
  <style>
    .ScreenScroll .SettingsGroup {
      box-shadow: none;
      border: 1px solid var(--gk-border);
    }
    .notif-toggle {
      width: 44px;
      height: 26px;
      border-radius: 999px;
      border: none;
      background: var(--gk-green-700);
      position: relative;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
    }
    .notif-toggle::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 22px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      transition: left 0.15s ease;
    }
    .notif-toggle.off {
      background: #c5cfc9;
    }
    .notif-toggle.off::after {
      left: 3px;
    }
  </style>
</head>
<body>
  <div class="phone-stage">
    <div class="phone-frame">
      <div class="phone-notch">9:41</div>
      <div class="Screen">
        <header class="Header">
          <div class="Header-left">
            <a class="HeaderBack" href="profile.html" aria-label="Back">&lsaquo;</a>
            <h1 class="HeaderTitle" data-i18n="settings.title">Settings</h1>
          </div>
        </header>
        <div class="ScreenScroll stack">
          <div class="SettingsGroup">
            <a class="SettingsRow" href="settings-language.html">
              <span class="SettingsIco" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>
              </span>
              <span class="grow">
                <span data-i18n="settings.language">Language</span><br />
                <span class="hint" data-i18n="settings.language.hint">App display language</span>
              </span>
              <span class="chev" id="langHint">EN</span>
            </a>
            <div class="SettingsRow">
              <span class="SettingsIco" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1 1 12 0c0 7 3 7 3 7H3s3 0 3-7"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
              </span>
              <span class="grow">Notifications</span>
              <button type="button" class="notif-toggle" id="notifToggle" aria-label="Toggle notifications" aria-pressed="true"></button>
            </div>
          </div>

          <div class="SettingsGroup">
            <a class="SettingsRow" href="delete-account.html" style="color:var(--gk-danger);">
              <span class="SettingsIco" style="color:var(--gk-danger);" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M7 7v12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V7"/><path d="M10 11v6M14 11v6"/></svg>
              </span>
              <span class="grow">Delete account</span>
              <span class="chev">›</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../shared/i18n.js"></script>
  <script>
    var map = { en: "EN", hi: "HI", bn: "BN" };
    document.getElementById("langHint").textContent = map[GK_I18N.getLang()] || "EN";

    var toggle = document.getElementById("notifToggle");
    try {
      if (localStorage.getItem("gk_notif") === "off") {
        toggle.classList.add("off");
        toggle.setAttribute("aria-pressed", "false");
      }
    } catch (e) {}
    toggle.addEventListener("click", function () {
      var on = toggle.classList.toggle("off");
      toggle.setAttribute("aria-pressed", on ? "false" : "true");
      try { localStorage.setItem("gk_notif", on ? "off" : "on"); } catch (e) {}
    });
  </script>
</body>
</html>
