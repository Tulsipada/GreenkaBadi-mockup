<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customer - Messages - Green Kabadi</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/app-shell.css" />
  <link rel="stylesheet" href="../shared/components.css" />
  <link rel="stylesheet" href="../shared/card-app.css" />
</head>
<body>
  <div class="phone-stage">
    <div class="phone-frame">
      <div class="phone-notch">9:41</div>
      <div class="Screen">
        <header class="Header">
          <div class="Header-left">
            <h1 class="HeaderTitle" data-i18n="tab.messages">Messages</h1>
          </div>
          <div class="Header-right">
            <a class="HeaderIcon" href="notifications.html" title="Notifications" aria-label="Notifications">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 7 3 7 3 7H3s3 0 3-7"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
              <span class="badge">3</span>
            </a>
          </div>
        </header>
        <div class="ScreenScroll pad-tab">
          <label class="SearchField SearchField-soft" style="margin-bottom:12px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" placeholder="Search chats…" autocomplete="off" />
          </label>

          <div class="ConvoSheet">
            <a class="ConvoRow has-unread" href="chat.html?order=c4e2a91b-7f03-4d88-a1e6-5b2c9d0e8f14">
              <div class="ConvoAvatar">K<span class="ConvoOnline" title="Active"></span></div>
              <div class="ConvoBody">
                <div class="ConvoTop">
                  <h3 class="ConvoName">Karim</h3>
                  <span class="ConvoTime">2m</span>
                </div>
                <p class="ConvoPreview">I'll call at the gate.</p>
                <span class="ConvoTag">Old fridge · #c4e2a91b</span>
              </div>
              <div class="ConvoSide">
                <span class="ConvoUnread">1</span>
              </div>
            </a>

            <a class="ConvoRow is-closed" href="chat.html?order=a3f1c8e2-9b4d-4e71-8c2a-1f6d0e9b3a47&status=completed">
              <div class="ConvoAvatar">K</div>
              <div class="ConvoBody">
                <div class="ConvoTop">
                  <h3 class="ConvoName">Karim</h3>
                  <span class="ConvoTime">Yesterday</span>
                </div>
                <p class="ConvoPreview">Chat closed · Pickup completed</p>
                <span class="ConvoTag is-closed">Metal scrap · #a3f1c8e2</span>
              </div>
              <div class="ConvoSide">
                <span class="ConvoClosed">Closed</span>
              </div>
            </a>

            <a class="ConvoRow is-link" href="history.html">
              <div class="ConvoAvatar is-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
              </div>
              <div class="ConvoBody">
                <div class="ConvoTop">
                  <h3 class="ConvoName">Pickup history</h3>
                </div>
                <p class="ConvoPreview">Past pickups and payments</p>
              </div>
              <div class="ConvoSide"></div>
            </a>
          </div>
        </div>
        <nav class="Footer">
          <a href="home.html"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 3l8 7.5"/><path d="M6 9.5V21h12V9.5"/><path d="M10 21v-6h4v6"/></svg></span><span data-i18n="tab.home">Home</span></a>
          <a href="history.html"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><span data-i18n="tab.history">History</span></a>
          <div class="fab-wrap"><a class="fab" href="post.html" title="Post">+</a></div>
          <a class="active" href="messages.html"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7A2.5 2.5 0 0 1 17.5 16H9l-5 4V6.5z"/></svg></span><span data-i18n="tab.messages">Messages</span></a>
          <a href="profile.html"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.25"/><path d="M5.5 19.5c1.6-3.2 4-4.75 6.5-4.75s4.9 1.55 6.5 4.75"/></svg></span><span data-i18n="tab.profile">Profile</span></a>
        </nav>
      </div>
    </div>
  </div>
  <script src="../shared/i18n.js"></script>
</body>
</html>
