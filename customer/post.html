<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customer - Post scrap - Green Kabadi</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/app-shell.css" />
  <link rel="stylesheet" href="../shared/components.css" />
  <link rel="stylesheet" href="../shared/card-app.css" />
</head>
<body>
  <div class="phone-stage">
    <div class="phone-frame">
      <div class="phone-notch">9:41</div>
      <div class="Screen">
        <header class="Header">
          <a class="HeaderBack" href="home.html" aria-label="Back">&lsaquo;</a>
          <div class="grow">
            <h1 class="HeaderTitle">Post scrap</h1>
            <span class="HeaderSub">Step 1 of 2 - Item details</span>
          </div>
        </header>
        <div class="ScreenScroll">
          <div class="Field">
            <label>Category</label>
            <select id="category">
              <option value="">Select category</option>
              <option value="metal">Metal</option>
              <option value="electronics">Electronics</option>
              <option value="plastic">Plastic</option>
              <option value="paper">Paper</option>
            </select>
          </div>

          <div class="Field" id="subWrap" hidden>
            <label>Sub category</label>
            <select id="subcategory">
              <option value="">Select sub category</option>
            </select>
          </div>

          <div class="Field" id="materialWrap" hidden>
            <label>Material name</label>
            <input id="material" type="text" placeholder="e.g. Copper wire, Old fridge" />
          </div>

          <div class="Field" id="weightWrap" hidden>
            <label>Approx. weight (kg)</label>
            <input id="weight" type="number" min="0" step="0.1" placeholder="e.g. 40" />
          </div>

          <div id="photosWrap">
            <label style="display:block;font-size:13px;font-weight:600;color:var(--gk-ink-2);margin:12px 0 8px;">Photos (1-5)</label>
            <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;">
              <div id="photoList" style="display:flex;flex-wrap:wrap;gap:10px;"></div>
              <button type="button" id="addPhotoBtn" aria-label="Add photo" style="width:64px;height:64px;border-radius:12px;border:1.5px dashed rgba(27,107,74,0.45);background:var(--gk-green-50);color:var(--gk-green-700);font-size:28px;font-weight:600;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;">+</button>
            </div>
            <p class="muted" style="margin:8px 0 0;font-size:12px;">Camera or gallery</p>
          </div>

          <div class="Card" id="estimateCard" style="background:var(--gk-green-50);border-color:rgba(27,107,74,0.2);">
            <span class="muted" style="font-size:12px;font-weight:700;">Estimated price (indication only)</span>
            <div style="font-size:28px;font-weight:800;color:var(--gk-green-700);margin-top:4px;" id="estimateAmt">Rs. 0</div>
            <p class="muted" style="margin:6px 0 0;font-size:12px;" id="estimateHint">Select category, sub category and enter weight</p>
          </div>

          <p class="muted">Final amount = verified weight x Green Kabadi rate at pickup (not this estimate).</p>
          <a class="Btn Btn-primary Btn-block" href="post-address.html" id="nextBtn">Next - Address</a>
        </div>
      </div>
    </div>
  </div>
  <script>
    var rates = {
      metal: { copper: 450, iron: 25, aluminium: 120, steel: 30 },
      electronics: { fridge: 8, tv: 10, laptop: 40, mixed: 8 },
      plastic: { pet: 12, hdpe: 15, mixed: 5 },
      paper: { newspaper: 10, carton: 6, mixed: 4 }
    };
    var labels = {
      metal: { copper: "Copper", iron: "Iron", aluminium: "Aluminium", steel: "Steel" },
      electronics: { fridge: "Fridge / AC", tv: "TV / Monitor", laptop: "Laptop / PC", mixed: "Mixed e-waste" },
      plastic: { pet: "PET bottles", hdpe: "HDPE", mixed: "Mixed plastic" },
      paper: { newspaper: "Newspaper", carton: "Carton / cardboard", mixed: "Mixed paper" }
    };
    var defaults = {
      metal: { copper: "Copper scrap", iron: "Iron scrap", aluminium: "Aluminium scrap", steel: "Steel scrap" },
      electronics: { fridge: "Old fridge", tv: "LED TV", laptop: "Old laptop", mixed: "Mixed electronics" },
      plastic: { pet: "PET bottles", hdpe: "HDPE items", mixed: "Mixed plastic" },
      paper: { newspaper: "Old newspapers", carton: "Carton boxes", mixed: "Mixed paper" }
    };

    var category = document.getElementById("category");
    var subcategory = document.getElementById("subcategory");
    var material = document.getElementById("material");
    var weight = document.getElementById("weight");
    var photoList = document.getElementById("photoList");
    var addPhotoBtn = document.getElementById("addPhotoBtn");
    var photoCount = 0;
    var maxPhotos = 5;

    function currentRate() {
      var c = category.value;
      var s = subcategory.value;
      if (!c || !s || !rates[c] || rates[c][s] == null) return 0;
      return rates[c][s];
    }

    function updateEstimate() {
      var w = parseFloat(weight.value);
      var rate = currentRate();
      var ready = subcategory.value && !isNaN(w) && w > 0 && rate > 0;
      if (!ready) {
        document.getElementById("estimateAmt").textContent = "Rs. 0";
        document.getElementById("estimateHint").textContent =
          "Select category, sub category and enter weight";
        return;
      }
      var amt = Math.round(w * rate);
      document.getElementById("estimateAmt").textContent = "Rs. " + amt.toLocaleString("en-IN");
      document.getElementById("estimateHint").textContent =
        w + " kg x Rs. " + rate + " / kg (indication only)";
    }

    function syncAddBtn() {
      addPhotoBtn.style.display = photoCount >= maxPhotos ? "none" : "flex";
    }

    addPhotoBtn.addEventListener("click", function () {
      if (photoCount >= maxPhotos) return;
      photoCount += 1;
      var thumb = document.createElement("div");
      thumb.style.cssText =
        "width:64px;height:64px;border-radius:12px;background:linear-gradient(135deg,#d1fae5,#e0f2fe);border:1px solid rgba(27,107,74,0.2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--gk-green-700);position:relative;";
      thumb.textContent = "Img " + photoCount;
      var remove = document.createElement("button");
      remove.type = "button";
      remove.setAttribute("aria-label", "Remove photo");
      remove.textContent = "x";
      remove.style.cssText =
        "position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:none;background:#ef4444;color:#fff;font-size:11px;line-height:1;cursor:pointer;padding:0;";
      remove.addEventListener("click", function () {
        thumb.remove();
        photoCount -= 1;
        syncAddBtn();
      });
      thumb.appendChild(remove);
      photoList.appendChild(thumb);
      syncAddBtn();
    });

    category.addEventListener("change", function () {
      var c = category.value;
      subcategory.innerHTML = '<option value="">Select sub category</option>';
      document.getElementById("subWrap").hidden = !c;
      document.getElementById("materialWrap").hidden = true;
      document.getElementById("weightWrap").hidden = true;
      material.value = "";
      weight.value = "";
      updateEstimate();
      if (!c || !labels[c]) return;
      Object.keys(labels[c]).forEach(function (key) {
        var opt = document.createElement("option");
        opt.value = key;
        opt.textContent = labels[c][key];
        subcategory.appendChild(opt);
      });
    });

    subcategory.addEventListener("change", function () {
      var c = category.value;
      var s = subcategory.value;
      var show = !!s;
      document.getElementById("materialWrap").hidden = !show;
      document.getElementById("weightWrap").hidden = !show;
      weight.value = "";
      updateEstimate();
      if (show && defaults[c] && defaults[c][s]) {
        material.value = defaults[c][s];
        material.focus();
      } else {
        material.value = "";
      }
    });

    weight.addEventListener("input", updateEstimate);
  </script>
</body>
</html>
