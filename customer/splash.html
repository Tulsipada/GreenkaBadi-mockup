<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customer - Splash - GreenकBadi</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/app-shell.css" />
  <link rel="stylesheet" href="../shared/components.css" />
  <link rel="stylesheet" href="../shared/card-app.css" />
  <style>
    .splash-screen {
      background: linear-gradient(180deg, #ffffff 0%, #f0fdf4 48%, #dcfce7 100%);
      position: relative;
      overflow: hidden;
    }
    .splash-screen .auth-wrap {
      justify-content: center;
      position: relative;
      z-index: 1;
      padding-bottom: 100px;
    }
    .splash-screen .auth-brand img {
      width: min(300px, 90%);
      max-height: none;
    }
    .splash-foot {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 18px;
      z-index: 2;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--gk-green-700);
      letter-spacing: 0.01em;
      padding: 0 20px;
    }
    .splash-landscape {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 140px;
      pointer-events: none;
      z-index: 0;
    }
    .splash-landscape svg { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <div class="phone-stage">
    <div class="phone-frame">
      <div class="phone-notch">9:41</div>
      <div class="Screen splash-screen">
        <div class="auth-wrap">
          <div class="auth-brand">
            <img src="../assets/logo-full.png" alt="GreenकBadi" />
          </div>
          <a class="Btn Btn-primary Btn-block" href="language.html" data-i18n="splash.create">Create account</a>
          <a class="Btn Btn-outline Btn-block" href="login.html" data-i18n="splash.login">Log in</a>
        </div>
        <p class="splash-foot">A Cleaner Today, A Better Tomorrow</p>
        <div class="splash-landscape" aria-hidden="true">
          <svg viewBox="0 0 390 140" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0 90 Q70 45 140 75 T280 60 T390 85 V140 H0 Z" fill="#86efac" opacity="0.5"/>
            <path d="M0 105 Q90 70 170 95 T330 80 T390 100 V140 H0 Z" fill="#16a34a" opacity="0.32"/>
            <circle cx="52" cy="82" r="20" fill="#22c55e" opacity="0.45"/>
            <circle cx="78" cy="78" r="15" fill="#15803d" opacity="0.4"/>
            <rect x="175" y="88" width="12" height="32" fill="#14532d" opacity="0.3"/>
            <circle cx="181" cy="78" r="16" fill="#16a34a" opacity="0.45"/>
            <rect x="250" y="95" width="28" height="22" rx="2" fill="#14532d" opacity="0.2"/>
            <circle cx="320" cy="88" r="18" fill="#22c55e" opacity="0.4"/>
            <circle cx="342" cy="84" r="13" fill="#15803d" opacity="0.35"/>
          </svg>
        </div>
      </div>
    </div>
  </div>
  <script src="../shared/i18n.js"></script>
</body>
</html>
