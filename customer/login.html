<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customer - Login - Green Kabadi</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/app-shell.css" />
  <link rel="stylesheet" href="../shared/components.css" />
  <link rel="stylesheet" href="../shared/card-app.css" />
</head>
<body>
  <div class="phone-stage">
    <div class="phone-frame">
      <div class="phone-notch">9:41</div>
      <div class="Screen">
        <div class="auth-wrap">
          <div class="auth-brand">
            <img src="../assets/logo.png" alt="Green Kabadi" />
            <p class="muted" data-i18n="login.title">Welcome back</p>
          </div>
          <div class="Field">
            <label data-i18n="login.email">Email</label>
            <input type="email" placeholder="you@email.com" />
          </div>
          <div class="Field">
            <label data-i18n="login.password">Password</label>
            <input type="password" placeholder="********" />
          </div>
          <p class="muted" style="margin:-4px 0 8px;text-align:right;font-size:13px;">
            <a class="link" href="forgot-password.html">Forgot password?</a>
          </p>
          <a class="Btn Btn-primary Btn-block" href="home.html" data-i18n="login.submit">Log in</a>
          <p class="center muted">New here? <a class="link" href="language.html" data-i18n="splash.create">Create account</a></p>
        </div>
      </div>
    </div>
  </div>
  <script src="../shared/i18n.js"></script>
</body>
</html>
