<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customer - Forgot password - Green Kabadi</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/app-shell.css" />
  <link rel="stylesheet" href="../shared/components.css" />
  <link rel="stylesheet" href="../shared/card-app.css" />
</head>
<body>
  <div class="phone-stage">
    <div class="phone-frame">
      <div class="phone-notch">9:41</div>
      <div class="Screen">
        <header class="Header">
          <a class="HeaderBack" href="login.html" aria-label="Back">&lsaquo;</a>
          <div class="grow">
            <h1 class="HeaderTitle">Forgot password</h1>
            <span class="HeaderSub">Customers only</span>
          </div>
        </header>
        <div class="ScreenScroll">
          <div id="formView">
            <p class="muted" style="margin:0 0 4px;">Enter the email on your Green Kabadi account. We’ll send a reset link if it matches.</p>
            <div class="Field">
              <label for="email">Email</label>
              <input id="email" type="email" autocomplete="email" placeholder="you@email.com" />
            </div>
            <p id="error" class="muted" style="margin:0;font-size:12px;color:var(--gk-danger);display:none;"></p>
            <button type="button" class="Btn Btn-primary Btn-block" id="sendBtn">Send reset link</button>
            <a class="Btn Btn-ghost Btn-block" href="login.html">Back to log in</a>
          </div>
          <div id="doneView" hidden>
            <div class="Card" style="text-align:center;padding:24px 18px;">
              <div style="width:56px;height:56px;border-radius:999px;background:var(--gk-green-50);color:var(--gk-green-700);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:24px;font-weight:800;">✓</div>
              <h3 style="margin:0 0 8px;color:var(--gk-green-900);">Check your email</h3>
              <p class="muted" style="margin:0;line-height:1.45;" id="doneText">If an account exists for that email, you’ll get a password reset link shortly.</p>
            </div>
            <a class="Btn Btn-primary Btn-block" href="login.html" style="margin-top:14px;">Back to log in</a>
            <button type="button" class="Btn Btn-ghost Btn-block" id="againBtn">Use a different email</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    var formView = document.getElementById("formView");
    var doneView = document.getElementById("doneView");
    var err = document.getElementById("error");
    var emailEl = document.getElementById("email");

    document.getElementById("sendBtn").addEventListener("click", function () {
      err.style.display = "none";
      var email = (emailEl.value || "").trim();
      if (!email || email.indexOf("@") < 1) {
        err.textContent = "Enter a valid email address.";
        err.style.display = "block";
        emailEl.focus();
        return;
      }
      document.getElementById("doneText").textContent =
        "If an account exists for " + email + ", you’ll get a password reset link shortly.";
      formView.hidden = true;
      doneView.hidden = false;
    });

    document.getElementById("againBtn").addEventListener("click", function () {
      doneView.hidden = true;
      formView.hidden = false;
      emailEl.focus();
    });
  </script>
</body>
</html>
