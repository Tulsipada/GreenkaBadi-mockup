<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customer - Sign up - Green Kabadi</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/app-shell.css" />
  <link rel="stylesheet" href="../shared/components.css" />
  <link rel="stylesheet" href="../shared/card-app.css" />
</head>
<body>
  <div class="phone-stage">
    <div class="phone-frame">
      <div class="phone-notch">9:41</div>
      <div class="Screen">
        <header class="Header">
          <a class="HeaderBack" href="language.html" aria-label="Back">&lsaquo;</a>
          <h1 class="HeaderTitle" data-i18n="signup.title">Create account</h1>
        </header>
        <div class="ScreenScroll">
          <div class="Field">
            <label data-i18n="signup.name">Full name</label>
            <input type="text" placeholder="Rina Sharma" />
          </div>
          <div class="Field">
            <label data-i18n="signup.phone">Mobile number</label>
            <input type="tel" placeholder="98XXXXXXXX" />
          </div>
          <div class="Field">
            <label data-i18n="login.email">Email</label>
            <input type="email" placeholder="you@email.com" />
          </div>
          <div class="Field">
            <label data-i18n="login.password">Password</label>
            <input type="password" placeholder="********" />
          </div>
          <a class="Btn Btn-primary Btn-block" href="home.html" data-i18n="signup.submit">Sign up</a>
          <p class="center muted">Already have an account? <a class="link" href="login.html" data-i18n="splash.login">Log in</a></p>
        </div>
      </div>
    </div>
  </div>
  <script src="../shared/i18n.js"></script>
</body>
</html>
