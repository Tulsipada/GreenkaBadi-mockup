<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customer - Saved addresses - Green Kabadi</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/app-shell.css" />
  <link rel="stylesheet" href="../shared/components.css" />
  <link rel="stylesheet" href="../shared/card-app.css" />
</head>
<body>
  <div class="phone-stage">
    <div class="phone-frame">
      <div class="phone-notch">9:41</div>
      <div class="Screen">
        <header class="Header">
          <a class="HeaderBack" href="home.html" id="backLink" aria-label="Back">&lsaquo;</a>
          <div class="grow">
            <h1 class="HeaderTitle">Saved addresses</h1>
            <span class="HeaderSub">Change default or add new</span>
          </div>
        </header>
        <div class="ScreenScroll stack">
          <div class="JobFeed">
            <a class="JobRow" href="home.html" id="addrHome">
              <div class="JobMain">
                <div class="JobKicker">
                  <span class="JobStatus is-completed">Default</span>
                </div>
                <h3>Home</h3>
                <p>Flat 4B, Sector 2, Salt Lake · 700091</p>
              </div>
              <span class="JobGo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span>
            </a>
            <a class="JobRow" href="home.html" id="addrShop">
              <div class="JobMain">
                <div class="JobKicker">
                  <span class="JobOid">Set default</span>
                </div>
                <h3>Shop</h3>
                <p>Milanmore, Champasari, Siliguri · 734003</p>
              </div>
              <span class="JobGo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span>
            </a>
          </div>
          <a class="Btn Btn-secondary Btn-block" href="address-add.html" id="addLink">Add address</a>
          <p class="muted">Selecting an address sets it for Home and future pickups.</p>
        </div>
      </div>
    </div>
  </div>
  <script>
    var params = new URLSearchParams(location.search);
    if (params.get("from") === "post") {
      document.getElementById("backLink").href = "post-address.html";
      document.getElementById("addrHome").href = "post-address.html";
      document.getElementById("addrShop").href = "post-address.html";
      document.getElementById("addLink").href = "address-add.html?from=post";
    }
  </script>
</body>
</html>
