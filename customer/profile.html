<body>
  <div class="phone-stage">
    <div class="phone-frame profile-page">
      <div class="phone-notch">9:41</div>
      <div class="Screen">
        <header class="Header">
          <div class="Header-left">

            <a class="HeaderIcon" href="notifications.html" title="Notifications" aria-label="Notifications">

              <span class="badge">3</span>

        </header>

        <div class="profile-main" id="profileScroll">
          <div class="ProfileHero">
            <div class="ProfileHeroAvatar" id="profileAvatar">R</div>
            <h2 id="profileName">Rina Sharma</h2>
            <p id="profileMeta">rina@email.com · 98XXXXXXXX</p>
            <div class="ProfileHeroActions">

                Edit

              </a>
            </div>
          </div>

          <p class="ProfileSection">Account</p>
          <div class="ProfileSheet">
            <a class="ProfileLink" href="addresses.html">
              <span class="ProfileLinkIco" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.2 7-11a7 7 0 1 0-14 0c0 5.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></span>
              <span class="label">Saved addresses</span>
              <span class="chev">›</span>
            </a>
            <a class="ProfileLink" href="history.html">
              <span class="ProfileLinkIco" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
              <span class="label">My transactions / History</span>
              <span class="chev">›</span>
            </a>
            <a class="ProfileLink" href="change-password.html">
              <span class="ProfileLinkIco" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
              <span class="label">Change password</span>
              <span class="chev">›</span>
            </a>
          </div>

          <p class="ProfileSection">Support</p>
          <div class="ProfileSheet">
            <a class="ProfileLink" href="help.html">
              <span class="ProfileLinkIco" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2.5-3 4"/><path d="M12 17h.01"/></svg></span>
              <span class="label">Help &amp; FAQ</span>
              <span class="chev">›</span>
            </a>
            <a class="ProfileLink" href="contact.html">
              <span class="ProfileLinkIco" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v2a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h2a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.6a2 2 0 0 1-.5 2.1L7.1 9.9a16 16 0 0 0 6 6l1.5-1.1a2 2 0 0 1 2.1-.5c.8.3 1.7.5 2.6.6a2 2 0 0 1 1.7 2z"/></svg></span>
              <span class="label">Contact us</span>
              <span class="chev">›</span>
            </a>
          </div>

          <p class="ProfileSection">Legal</p>
          <div class="ProfileSheet">
            <a class="ProfileLink" href="privacy.html">
              <span class="ProfileLinkIco" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span>
              <span class="label">Privacy policy</span>
              <span class="chev">›</span>
            </a>
            <a class="ProfileLink" href="terms.html">
              <span class="ProfileLinkIco" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h6"/></svg></span>
              <span class="label">Terms of service</span>
              <span class="chev">›</span>
            </a>
          </div>

          <a class="ProfileLogout" href="splash.html" data-i18n="profile.logout">Log out</a>
          <p class="profile-ver">Green Kabadi · v1.0 mockup</p>
        </div>

        <nav class="Footer">
          <a href="home.html"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 3l8 7.5"/><path d="M6 9.5V21h12V9.5"/><path d="M10 21v-6h4v6"/></svg></span><span data-i18n="tab.home">Home</span></a>
          <a href="history.html"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><span data-i18n="tab.history">History</span></a>
          <div class="fab-wrap"><a class="fab" href="post.html">+</a></div>
          <a href="messages.html"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7A2.5 2.5 0 0 1 17.5 16H9l-5 4V6.5z"/></svg></span><span data-i18n="tab.messages">Messages</span></a>
          <a class="active" href="profile.html"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.25"/><path d="M5.5 19.5c1.6-3.2 4-4.75 6.5-4.75s4.9 1.55 6.5 4.75"/></svg></span><span data-i18n="tab.profile">Profile</span></a>
        </nav>
      </div>
    </div>
  </div>
  <script src="../shared/i18n.js"></script>
  <script>
    try {
      var p = JSON.parse(localStorage.getItem("gk_profile") || "null");
      if (p) {
        if (p.name) document.getElementById("profileName").textContent = p.name;
        var meta = [];
        if (p.email) meta.push(p.email);
        if (p.phone) meta.push(p.phone);
        if (meta.length) document.getElementById("profileMeta").textContent = meta.join(" · ");
        if (p.photo) {
          var av = document.getElementById("profileAvatar");
          av.textContent = "";
          av.style.backgroundImage = "url(" + p.photo + ")";
        }
      }
    } catch (e) {}

    function layoutProfile() {
      var screen = document.querySelector(".profile-page .Screen");
      var header = screen && screen.querySelector(".Header");
      var footer = screen && screen.querySelector(".Footer");
      var main = document.getElementById("profileScroll");
      if (!screen || !header || !footer || !main) return;
      main.style.top = header.offsetHeight + "px";
      main.style.bottom = footer.offsetHeight + "px";
    }
    layoutProfile();
    window.addEventListener("resize", layoutProfile);
  </script>
</body>
</html>
