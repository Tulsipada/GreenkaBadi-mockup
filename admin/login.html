<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Login · GreenकBadi</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/app-shell.css" />
  <link rel="stylesheet" href="../shared/components.css" />
  <link rel="stylesheet" href="../shared/card-app.css" />
  <style>
    .admin-login {
      max-width: 420px;
      margin: 60px auto;
      background: var(--gk-white);
      border-radius: 20px;
      padding: 32px;
      box-shadow: var(--gk-shadow-md);
    }
  </style>
</head>
<body>
  <div class="admin-stage">
    <div class="admin-login">
      <div class="auth-brand">
        <img src="../assets/logo.png" alt="GreenकBadi" />
        <p class="muted">Admin login · Company account</p>
      </div>
      <div class="Field">
        <label>Email</label>
        <input type="email" placeholder="admin@greenkabadi.com" />
      </div>
      <div class="Field">
        <label>Password</label>
        <input type="password" placeholder="••••••••" />
      </div>
      <a class="Btn Btn-primary Btn-block" href="inbox.html">Log in</a>
    </div>
  </div>
</body>
</html>
