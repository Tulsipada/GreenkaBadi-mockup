<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Staffs · GreenकBadi</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/app-shell.css" />
  <link rel="stylesheet" href="../shared/components.css" />
</head>
<body>
  <div class="admin-stage">
    <div class="admin-frame">
      <div class="admin-body">
        <aside class="admin-sidebar">
          <div class="brand">
            <img src="../assets/logo.png" alt="" />
            <strong>GreenकBadi</strong>
          </div>
          <nav class="admin-nav">
            <a href="inbox.html"><span>Inbox</span></a>
            <a href="monitor.html"><span>Transactions</span></a>
            <a href="users.html"><span>Users</span></a>
            <a class="active" href="staff.html"><span>Staffs</span></a>
            <a href="categories.html"><span>Categories</span></a>
            <a href="contacts.html"><span>Contact</span></a>
            <a href="notifications.html"><span>Notifications</span></a>
            <a href="settings.html"><span>Settings</span></a>
          </nav>
          <a class="admin-logout" href="login.html">Log out</a>
        </aside>
        <div class="admin-main">
          <div class="admin-topbar">
            <h1>Staffs</h1>
            <a class="Btn Btn-primary" href="staff-add.html" style="min-height:36px;padding:8px 14px;font-size:13px;width:auto;">Add staff</a>
          </div>
          <div class="admin-content">
            <table class="table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Phone</th>
                  <th>Login</th>
                  <th>Jobs today</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="staffBody"></tbody>
            </table>
          </div>
          <div class="admin-foot">Collectors created by admin with login password</div>
        </div>
      </div>
    </div>
  </div>
  <script>
    var defaultStaff = [
      { name: "Karim", phone: "91XXXX1001", login: "karim", jobs: 2, status: "Active", passwordSet: true },
      { name: "Suman", phone: "91XXXX1002", login: "suman", jobs: 1, status: "Active", passwordSet: true }
    ];

    function loadStaff() {
      try {
        var saved = JSON.parse(localStorage.getItem("gk_admin_staff") || "null");
        if (saved && saved.length) return saved;
      } catch (e) {}
      return defaultStaff.slice();
    }

    function chip(status) {
      var cls = status === "Active" ? "Chip-done" : "Chip-waiting";
      return '<span class="Chip ' + cls + '">' + status + "</span>";
    }

    var body = document.getElementById("staffBody");
    loadStaff().forEach(function (s) {
      var tr = document.createElement("tr");
      tr.innerHTML =
        "<td><strong>" + s.name + "</strong></td>" +
        "<td>" + (s.phone || "—") + "</td>" +
        "<td>" + (s.login || "—") + "</td>" +
        "<td>" + (s.jobs != null ? s.jobs : 0) + "</td>" +
        "<td>" + chip(s.status || "Active") + "</td>";
      body.appendChild(tr);
    });
  </script>
  <script src="admin-chrome.js"></script>
</body>
</html>
