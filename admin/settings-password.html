<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Change password · GreenकBadi</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/app-shell.css" />
  <link rel="stylesheet" href="../shared/components.css" />
</head>
<body>
  <div class="admin-stage">
    <div class="admin-frame">
      <div class="admin-body">
        <aside class="admin-sidebar">
          <div class="brand">
            <img src="../assets/logo.png" alt="" />
            <strong>GreenकBadi</strong>
          </div>
          <nav class="admin-nav">
            <a href="inbox.html"><span>Inbox</span></a>
            <a href="monitor.html"><span>Transactions</span></a>
            <a href="users.html"><span>Users</span></a>
            <a href="staff.html"><span>Staffs</span></a>
            <a href="categories.html"><span>Categories</span></a>
            <a href="contacts.html"><span>Contact</span></a>
            <a href="notifications.html"><span>Notifications</span></a>
            <a class="active" href="settings.html"><span>Settings</span></a>
          </nav>
          <a class="admin-logout" href="login.html">Log out</a>
        </aside>
        <div class="admin-main">
          <div class="admin-topbar">
            <h1>Change password</h1>
            <a class="link" href="settings.html">← Settings</a>
          </div>
          <div class="admin-content">
            <div class="Card" style="padding:20px;">
              <form class="stack" id="form">
                <div class="Field">
                  <label for="current">Current password</label>
                  <input id="current" type="password" required autocomplete="current-password" />
                </div>
                <div class="Field">
                  <label for="next">New password</label>
                  <input id="next" type="password" required minlength="6" autocomplete="new-password" />
                </div>
                <div class="Field">
                  <label for="confirm">Confirm new password</label>
                  <input id="confirm" type="password" required minlength="6" autocomplete="new-password" />
                </div>
                <p class="mismatch" id="err" hidden></p>
                <p class="muted" id="ok" hidden style="color:var(--gk-green-700);font-weight:600;"></p>
                <button class="Btn Btn-primary" type="submit" style="align-self:flex-start;">Update password</button>
              </form>
            </div>
          </div>
          <div class="admin-foot">Mock only · password not stored securely</div>
        </div>
      </div>
    </div>
  </div>
  <script>
    document.getElementById("form").onsubmit = function (e) {
      e.preventDefault();
      var err = document.getElementById("err");
      var ok = document.getElementById("ok");
      err.hidden = true;
      ok.hidden = true;
      var next = document.getElementById("next").value;
      var confirm = document.getElementById("confirm").value;
      if (next !== confirm) {
        err.textContent = "Passwords do not match.";
        err.hidden = false;
        return;
      }
      ok.textContent = "Password updated.";
      ok.hidden = false;
      setTimeout(function () { location.href = "settings.html"; }, 700);
    };
  </script>
  <script src="admin-chrome.js"></script>
</body>
</html>
