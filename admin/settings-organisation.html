<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Organisation · GreenकBadi</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/app-shell.css" />
  <link rel="stylesheet" href="../shared/components.css" />
</head>
<body>
  <div class="admin-stage">
    <div class="admin-frame">
      <div class="admin-body">
        <aside class="admin-sidebar">
          <div class="brand">
            <img src="../assets/logo.png" alt="" />
            <strong>GreenकBadi</strong>
          </div>
          <nav class="admin-nav">
            <a href="inbox.html"><span>Inbox</span></a>
            <a href="jobs.html"><span>Jobs</span></a>
            <a href="monitor.html"><span>Transactions</span></a>
            <a href="users.html"><span>Users</span></a>
            <a href="staff.html"><span>Staffs</span></a>
            <a href="categories.html"><span>Categories</span></a>
            <a href="contacts.html"><span>Contact</span></a>
            <a href="notifications.html"><span>Notifications</span></a>
            <a class="active" href="settings.html"><span>Settings</span></a>
          </nav>
          <a class="admin-logout" href="login.html">Log out</a>
        </aside>
        <div class="admin-main">
          <div class="admin-topbar">
            <h1>Organisation</h1>
            <a class="link" href="settings.html">← Settings</a>
          </div>
          <div class="admin-content">
            <div class="Card" style="padding:20px;">
              <form class="stack" id="form">
                <div class="Field">
                  <label for="name">Organisation name</label>
                  <input id="name" type="text" required value="Greenkabadi" />
                </div>
                <div class="Field">
                  <label for="address">Address</label>
                  <textarea id="address" rows="3">Milanmore, Maheshmari, Champasari, Siliguri, West Bengal</textarea>
                </div>
                <button class="Btn Btn-primary" type="submit" style="align-self:flex-start;">Save</button>
              </form>
            </div>
          </div>
          <div class="admin-foot">Shown on admin account</div>
        </div>
      </div>
    </div>
  </div>
  <script>
    try {
      var org = JSON.parse(localStorage.getItem("gk_admin_org") || "null");
      if (org) {
        if (org.name) document.getElementById("name").value = org.name;
        if (org.address) document.getElementById("address").value = org.address;
      }
    } catch (e) {}
    document.getElementById("form").onsubmit = function (e) {
      e.preventDefault();
      localStorage.setItem("gk_admin_org", JSON.stringify({
        name: document.getElementById("name").value.trim(),
        address: document.getElementById("address").value.trim()
      }));
      location.href = "settings.html";
    };
  </script>
  <script src="admin-chrome.js"></script>
</body>
</html>
