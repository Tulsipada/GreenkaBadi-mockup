<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Edit paid amount · GreenकBadi</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/app-shell.css" />
  <link rel="stylesheet" href="../shared/components.css" />
</head>
<body>
  <div class="admin-stage">
    <div class="admin-frame">
      <div class="admin-body">
        <aside class="admin-sidebar">
          <div class="brand">
            <img src="../assets/logo.png" alt="" />
            <strong>GreenकBadi</strong>
          </div>
          <nav class="admin-nav">
            <a href="inbox.html"><span>Inbox</span></a>
            <a class="active" href="monitor.html"><span>Transactions</span></a>
            <a href="users.html"><span>Users</span></a>
            <a href="staff.html"><span>Staffs</span></a>
            <a href="categories.html"><span>Categories</span></a>
            <a href="contacts.html"><span>Contact</span></a>
            <a href="notifications.html"><span>Notifications</span></a>
            <a href="settings.html"><span>Settings</span></a>
          </nav>
          <a class="admin-logout" href="login.html">Log out</a>
        </aside>
        <div class="admin-main">
          <div class="admin-topbar">
            <h1>Edit paid amount</h1>
            <a class="link" href="monitor.html">← Transactions</a>
          </div>
          <div class="admin-content">
            <div class="Card" style="padding:20px;gap:14px;">
              <div>
                <h2 id="itemTitle" style="margin:0;font-size:18px;color:var(--gk-green-900);">—</h2>
                <p class="muted" id="meta" style="margin:6px 0 0;"></p>
              </div>
              <div class="row" style="justify-content:space-between;">
                <span class="muted">Order</span>
                <strong id="orderId">—</strong>
              </div>
              <div class="row" style="justify-content:space-between;">
                <span class="muted">Collector</span>
                <strong id="collector">—</strong>
              </div>
              <div class="row" style="justify-content:space-between;">
                <span class="muted">Date</span>
                <strong id="dateLabel">—</strong>
              </div>
              <form class="stack" id="form" style="margin-top:8px;">
                <div class="Field">
                  <label for="paid">Amount paid (₹)</label>
                  <input id="paid" type="number" min="0" step="1" required />
                </div>
                <p class="muted" style="margin:0;">Only the paid amount can be edited by admin.</p>
                <p class="mismatch" id="err" hidden></p>
                <button class="Btn Btn-primary" type="submit" style="align-self:flex-start;">Save amount</button>
              </form>
            </div>
          </div>
          <div class="admin-foot">Other transaction fields are read-only</div>
        </div>
      </div>
    </div>
  </div>
  <script>
    var KEY = "gk_admin_txns";
    var id = new URLSearchParams(location.search).get("id");
    var list = [];
    try { list = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) {}
    var item = list.find(function (t) { return t.id === id; });
    if (!item || item.status !== "completed") {
      location.href = "monitor.html";
    }

    document.getElementById("itemTitle").textContent = item.item || "Transaction";
    document.getElementById("meta").textContent =
      (item.customer || "—") + " · Completed";
    document.getElementById("orderId").textContent = item.short || item.id;
    document.getElementById("collector").textContent = item.collector || "—";
    document.getElementById("dateLabel").textContent = item.date || "—";
    document.getElementById("paid").value = item.paid != null ? item.paid : 0;

    document.getElementById("form").addEventListener("submit", function (e) {
      e.preventDefault();
      var err = document.getElementById("err");
      err.hidden = true;
      var paid = parseFloat(document.getElementById("paid").value);
      if (isNaN(paid) || paid < 0) {
        err.textContent = "Enter a valid paid amount.";
        err.hidden = false;
        return;
      }
      item.paid = paid;
      item.mismatch = false;
      try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (ex) {}
      location.href = "monitor.html";
    });
  </script>
  <script src="admin-chrome.js"></script>
</body>
</html>
