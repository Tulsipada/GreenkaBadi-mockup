<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Users · GreenकBadi</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/app-shell.css" />
  <link rel="stylesheet" href="../shared/components.css" />
</head>
<body>
  <div class="admin-stage">
    <div class="admin-frame">
      <div class="admin-body">
        <aside class="admin-sidebar">
          <div class="brand">
            <img src="../assets/logo.png" alt="" />
            <strong>GreenकBadi</strong>
          </div>
          <nav class="admin-nav">
            <a href="inbox.html"><span>Inbox</span></a>
            <a href="monitor.html"><span>Monitor</span></a>
            <a class="active" href="users.html"><span>Users</span></a>
            <a href="rates.html"><span>Rates</span></a>
            <a href="settings.html"><span>Settings</span></a>
          </nav>
        </aside>
        <div class="admin-main">
          <div class="admin-topbar">
            <h1>Users</h1>
            <a class="Btn Btn-primary" href="staff-add.html" style="min-height:36px;padding:8px 14px;font-size:13px;width:auto;">Add staff</a>
          </div>
          <div class="admin-content">
            <h3 style="margin:0;font-size:14px;color:var(--gk-green-800);">Customers</h3>
            <table class="table" id="customerTable">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Phone</th>
                  <th>Area</th>
                  <th>Pickups</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="customerBody"></tbody>
            </table>

            <h3 style="margin:16px 0 0;font-size:14px;color:var(--gk-green-800);">Staff (collectors)</h3>
            <table class="table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Phone</th>
                  <th>Login</th>
                  <th>Jobs today</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="staffBody"></tbody>
            </table>
          </div>
          <div class="admin-foot">Customers from app signup · Staff created by admin with password</div>
        </div>
      </div>
    </div>
  </div>
  <script>
    var customers = [
      { name: "Rina Sharma", phone: "98XXXX1122", area: "Salt Lake Sec 2", pickups: 3, status: "Active" },
      { name: "Amit Das", phone: "97XXXX3344", area: "Champasari", pickups: 5, status: "Active" },
      { name: "Priya", phone: "96XXXX5566", area: "Bidhannagar", pickups: 2, status: "Active" },
      { name: "Soham", phone: "95XXXX7788", area: "New Town", pickups: 0, status: "Active" }
    ];

    var defaultStaff = [
      { name: "Karim", phone: "91XXXX1001", login: "karim", jobs: 2, status: "Active", passwordSet: true },
      { name: "Suman", phone: "91XXXX1002", login: "suman", jobs: 1, status: "Active", passwordSet: true }
    ];

    function loadStaff() {
      try {
        var saved = JSON.parse(localStorage.getItem("gk_admin_staff") || "null");
        if (saved && saved.length) return saved;
      } catch (e) {}
      return defaultStaff.slice();
    }

    function chip(status) {
      var cls = status === "Active" ? "Chip-done" : "Chip-waiting";
      return '<span class="Chip ' + cls + '">' + status + "</span>";
    }

    var cBody = document.getElementById("customerBody");
    customers.forEach(function (c) {
      var tr = document.createElement("tr");
      tr.innerHTML =
        "<td><strong>" + c.name + "</strong></td>" +
        "<td>" + c.phone + "</td>" +
        "<td>" + c.area + "</td>" +
        "<td>" + c.pickups + "</td>" +
        "<td>" + chip(c.status) + "</td>";
      cBody.appendChild(tr);
    });

    var sBody = document.getElementById("staffBody");
    loadStaff().forEach(function (s) {
      var tr = document.createElement("tr");
      tr.innerHTML =
        "<td><strong>" + s.name + "</strong></td>" +
        "<td>" + (s.phone || "—") + "</td>" +
        "<td>" + (s.login || "—") + "</td>" +
        "<td>" + (s.jobs != null ? s.jobs : 0) + "</td>" +
        "<td>" + chip(s.status || "Active") + "</td>";
      sBody.appendChild(tr);
    });
  </script>
</body>
</html>
