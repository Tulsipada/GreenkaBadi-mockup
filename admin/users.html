<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Users · GreenकBadi</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/app-shell.css" />
  <link rel="stylesheet" href="../shared/components.css" />
</head>
<body>
  <div class="admin-stage">
    <div class="admin-frame">
      <div class="admin-body">
        <aside class="admin-sidebar">
          <div class="brand">
            <img src="../assets/logo.png" alt="" />
            <strong>GreenकBadi</strong>
          </div>
          <nav class="admin-nav">
            <a href="inbox.html"><span>Inbox</span></a>
            <a href="jobs.html"><span>Jobs</span></a>
            <a href="monitor.html"><span>Transactions</span></a>
            <a class="active" href="users.html"><span>Users</span></a>
            <a href="staff.html"><span>Staffs</span></a>
            <a href="categories.html"><span>Categories</span></a>
            <a href="contacts.html"><span>Contact</span></a>
            <a href="notifications.html"><span>Notifications</span></a>
            <a href="settings.html"><span>Settings</span></a>
          </nav>
          <a class="admin-logout" href="login.html">Log out</a>
        </aside>
        <div class="admin-main">
          <div class="admin-topbar">
            <h1>Users</h1>
            <span class="muted" style="font-size:13px;">Customers (app signup)</span>
          </div>
          <div class="admin-content">
            <table class="table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Phone</th>
                  <th>Area</th>
                  <th>Pickups</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="customerBody"></tbody>
            </table>
          </div>
          <div class="admin-foot">Customer accounts from the mobile app</div>
        </div>
      </div>
    </div>
  </div>
  <script>
    var customers = [
      { name: "Rina Sharma", phone: "98XXXX1122", area: "Salt Lake Sec 2", pickups: 3, status: "Active" },
      { name: "Amit Das", phone: "97XXXX3344", area: "Champasari", pickups: 5, status: "Active" },
      { name: "Priya", phone: "96XXXX5566", area: "Bidhannagar", pickups: 2, status: "Active" },
      { name: "Soham", phone: "95XXXX7788", area: "New Town", pickups: 0, status: "Active" }
    ];

    function chip(status) {
      var cls = status === "Active" ? "Chip-done" : "Chip-waiting";
      return '<span class="Chip ' + cls + '">' + status + "</span>";
    }

    var body = document.getElementById("customerBody");
    customers.forEach(function (c) {
      var tr = document.createElement("tr");
      tr.innerHTML =
        "<td><strong>" + c.name + "</strong></td>" +
        "<td>" + c.phone + "</td>" +
        "<td>" + c.area + "</td>" +
        "<td>" + c.pickups + "</td>" +
        "<td>" + chip(c.status) + "</td>";
      body.appendChild(tr);
    });
  </script>
  <script src="admin-chrome.js"></script>
</body>
</html>
