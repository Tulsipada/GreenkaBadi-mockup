<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Rates · GreenकBadi</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/app-shell.css" />
  <link rel="stylesheet" href="../shared/components.css" />
</head>
<body>
  <div class="admin-stage">
    <div class="admin-frame">
      <div class="admin-body">
        <aside class="admin-sidebar">
          <div class="brand">
            <img src="../assets/logo.png" alt="" />
            <strong>GreenकBadi</strong>
          </div>
          <nav class="admin-nav">
            <a href="inbox.html"><span>Inbox</span></a>
            <a href="monitor.html"><span>Monitor</span></a>
            <a href="users.html"><span>Users</span></a>
            <a class="active" href="rates.html"><span>Rates</span></a>
            <a href="settings.html"><span>Settings</span></a>
          </nav>
        </aside>
        <div class="admin-main">
          <div class="admin-topbar">
            <h1>Category rates</h1>
            <button class="Btn Btn-primary" type="button" style="min-height:40px;">Save rates</button>
          </div>
          <div class="admin-content">
            <table class="table">
              <thead>
                <tr>
                  <th>Category</th>
                  <th>Unit</th>
                  <th>Rate (₹)</th>
                  <th>Active</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>Metal</td>
                  <td>kg</td>
                  <td><input type="number" value="15" style="width:100px;min-height:40px;padding:8px;border-radius:10px;border:1px solid var(--gk-border);" /></td>
                  <td>Yes</td>
                </tr>
                <tr>
                  <td>Electronics</td>
                  <td>kg</td>
                  <td><input type="number" value="8" style="width:100px;min-height:40px;padding:8px;border-radius:10px;border:1px solid var(--gk-border);" /></td>
                  <td>Yes</td>
                </tr>
                <tr>
                  <td>Paper</td>
                  <td>kg</td>
                  <td><input type="number" value="6" style="width:100px;min-height:40px;padding:8px;border-radius:10px;border:1px solid var(--gk-border);" /></td>
                  <td>Yes</td>
                </tr>
                <tr>
                  <td>Plastic</td>
                  <td>kg</td>
                  <td><input type="number" value="5" style="width:100px;min-height:40px;padding:8px;border-radius:10px;border:1px solid var(--gk-border);" /></td>
                  <td>Yes</td>
                </tr>
              </tbody>
            </table>
            <p class="muted">Final pickup amount = verified weight × these GreenकBadi rates.</p>
          </div>
          <div class="admin-foot">GreenकBadi Admin · Rates</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
