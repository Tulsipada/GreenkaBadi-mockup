<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Settings · GreenकBadi</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/app-shell.css" />
  <link rel="stylesheet" href="../shared/components.css" />
</head>
<body>
  <div class="admin-stage">
    <div class="admin-frame">
      <div class="admin-body">
        <aside class="admin-sidebar">
          <div class="brand">
            <img src="../assets/logo.png" alt="" />
            <strong>GreenकBadi</strong>
          </div>
          <nav class="admin-nav">
            <a href="inbox.html"><span>Inbox</span></a>
            <a href="monitor.html"><span>Monitor</span></a>
            <a href="users.html"><span>Users</span></a>
            <a href="rates.html"><span>Rates</span></a>
            <a class="active" href="settings.html"><span>Settings</span></a>
          </nav>
        </aside>
        <div class="admin-main">
          <div class="admin-topbar">
            <h1 data-i18n="settings.title">Settings</h1>
          </div>
          <div class="admin-content" style="max-width:560px;">
            <div class="SettingsGroup">
              <a class="SettingsRow" href="settings-language.html">
                <span class="SettingsIco" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg></span>
                <span class="grow">
                  <span data-i18n="settings.language">Language</span><br />
                  <span class="hint" data-i18n="settings.language.hint">App display language</span>
                </span>
                <span class="chev" id="langHint">EN</span>
              </a>
              <div class="SettingsRow">
                <span class="SettingsIco" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V8l7-4 7 4v13"/><path d="M9 21v-6h6v6"/></svg></span>
                <span class="grow">Organisation<br /><span class="hint">Greenkabadi</span></span>
              </div>
            </div>
            <a class="Btn Btn-danger" href="login.html" style="align-self:flex-start;">Log out</a>
          </div>
          <div class="admin-foot">Preferences · Language change anytime</div>
        </div>
      </div>
    </div>
  </div>
  <script src="../shared/i18n.js"></script>
  <script>
    var map = { en: "EN", hi: "हिं", bn: "বাং" };
    document.getElementById("langHint").textContent = map[GK_I18N.getLang()] || "EN";
  </script>
</body>
</html>
