<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Language · GreenकBadi</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/app-shell.css" />
  <link rel="stylesheet" href="../shared/components.css" />
</head>
<body>
  <div class="admin-stage">
    <div class="admin-frame">
      <div class="admin-body">
        <aside class="admin-sidebar">
          <div class="brand">
            <img src="../assets/logo.png" alt="" />
            <strong>GreenकBadi</strong>
          </div>
          <nav class="admin-nav">
            <a href="inbox.html"><span>Inbox</span></a>
            <a href="monitor.html"><span>Monitor</span></a>
            <a href="users.html"><span>Users</span></a>
            <a href="rates.html"><span>Rates</span></a>
            <a class="active" href="settings.html"><span>Settings</span></a>
          </nav>
        </aside>
        <div class="admin-main">
          <div class="admin-topbar">
            <h1 data-i18n="settings.language">Language</h1>
            <a class="link" href="settings.html">← Settings</a>
          </div>
          <div class="admin-content" style="max-width:480px;">
            <div class="LangList">
              <button type="button" class="LangCard" data-lang="en"><span class="flag">EN</span><span><strong>English</strong><span>Continue in English</span></span></button>
              <button type="button" class="LangCard" data-lang="hi"><span class="flag">हिं</span><span><strong>हिन्दी</strong><span>हिन्दी में जारी रखें</span></span></button>
              <button type="button" class="LangCard" data-lang="bn"><span class="flag">বাং</span><span><strong>বাংলা</strong><span>বাংলায় চালিয়ে যান</span></span></button>
            </div>
            <a class="Btn Btn-primary" href="settings.html" style="align-self:flex-start;margin-top:8px;">Save</a>
          </div>
          <div class="admin-foot">Admin display language</div>
        </div>
      </div>
    </div>
  </div>
  <script src="../shared/i18n.js"></script>
  <script>
    function sync() {
      var cur = GK_I18N.getLang();
      document.querySelectorAll(".LangCard").forEach(function (b) {
        b.classList.toggle("selected", b.getAttribute("data-lang") === cur);
      });
    }
    document.querySelectorAll(".LangCard").forEach(function (btn) {
      btn.addEventListener("click", function () {
        GK_I18N.setLang(btn.getAttribute("data-lang"));
        sync();
      });
    });
    sync();
  </script>
</body>
</html>
