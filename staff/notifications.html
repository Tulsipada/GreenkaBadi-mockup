<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Staff - Notifications - Green Kabadi</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/app-shell.css" />
  <link rel="stylesheet" href="../shared/components.css" />
</head>
<body>
  <div class="phone-stage">
    <div class="phone-frame">
      <div class="phone-notch">9:41</div>
      <div class="Screen">
        <header class="Header">
          <div class="Header-left">
            <a class="HeaderBack" href="javascript:history.back()" aria-label="Back">&lsaquo;</a>
            <div style="min-width:0;">
              <h1 class="HeaderTitle">Notifications</h1>
              <span class="HeaderSub">New jobs &amp; messages</span>
            </div>
          </div>
          <div class="Header-right">
            <button class="HeaderIcon" type="button" title="Mark all read" aria-label="Mark all read" style="font-size:12px;font-weight:800;">✓</button>
          </div>
        </header>
        <div class="ScreenScroll pad-tab stack">
          <div class="NotifList">
            <a class="NotifItem unread" href="job-detail.html">
              <div class="NotifIcon green">📋</div>
              <div class="NotifBody">
                <strong>New job assigned</strong>
                <p>Old fridge · Rina · Sector 2, Salt Lake</p>
              </div>
              <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
                <span class="NotifMeta">5m</span>
                <span class="NotifDot" aria-hidden="true"></span>
              </div>
            </a>
            <a class="NotifItem unread" href="chat.html?order=c4e2a91b-7f03-4d88-a1e6-5b2c9d0e8f14">
              <div class="NotifIcon" style="background:#f3eefc;border-color:transparent;">💬</div>
              <div class="NotifBody">
                <strong>Customer message</strong>
                <p>Rina: "Please call at the gate."</p>
              </div>
              <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
                <span class="NotifMeta">22m</span>
                <span class="NotifDot" aria-hidden="true"></span>
              </div>
            </a>
            <a class="NotifItem" href="jobs.html">
              <div class="NotifIcon blue">🚚</div>
              <div class="NotifBody">
                <strong>Reminder</strong>
                <p>Mark On the way when you leave for LED TV pickup.</p>
              </div>
              <span class="NotifMeta">Today</span>
            </a>
          </div>
        </div>
        <nav class="Footer">
          <a href="jobs.html"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h4"/></svg></span><span data-i18n="tab.jobs">Jobs</span></a>
          <a href="messages.html"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7A2.5 2.5 0 0 1 17.5 16H9l-5 4V6.5z"/></svg></span><span data-i18n="tab.messages">Messages</span></a>
          <a href="profile.html"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.25"/><path d="M5.5 19.5c1.6-3.2 4-4.75 6.5-4.75s4.9 1.55 6.5 4.75"/></svg></span><span data-i18n="tab.profile">Profile</span></a>
        </nav>
      </div>
    </div>
  </div>
  <script src="../shared/i18n.js"></script>
</body>
</html>
