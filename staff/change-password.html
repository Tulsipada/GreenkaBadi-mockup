<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Staff - Change password - Green Kabadi</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/app-shell.css" />
  <link rel="stylesheet" href="../shared/components.css" />
</head>
<body>
  <div class="phone-stage">
    <div class="phone-frame">
      <div class="phone-notch">9:41</div>
      <div class="Screen">
        <header class="Header">
          <a class="HeaderBack" href="profile.html" aria-label="Back">&lsaquo;</a>
          <h1 class="HeaderTitle">Change password</h1>
        </header>
        <div class="ScreenScroll stack">
          <p class="muted" style="margin:0;">Use a strong password you do not reuse elsewhere.</p>

          <div class="Field">
            <label for="current">Current password</label>
            <input id="current" type="password" autocomplete="current-password" placeholder="Enter current password" />
          </div>
          <div class="Field">
            <label for="next">New password</label>
            <input id="next" type="password" autocomplete="new-password" placeholder="At least 8 characters" />
          </div>
          <div class="Field">
            <label for="confirm">Confirm new password</label>
            <input id="confirm" type="password" autocomplete="new-password" placeholder="Re-enter new password" />
          </div>

          <p class="muted" id="hint" style="margin:0;font-size:12px;">Must match and be at least 8 characters.</p>
          <p id="error" class="muted" style="margin:0;font-size:12px;color:var(--gk-danger);display:none;"></p>
          <p id="ok" class="muted" style="margin:0;font-size:12px;color:var(--gk-green-700);display:none;">Password updated.</p>

          <button type="button" class="Btn Btn-primary Btn-block" id="saveBtn">Update password</button>
          <a class="Btn Btn-ghost Btn-block" href="profile.html">Cancel</a>
        </div>
      </div>
    </div>
  </div>
  <script>
    var err = document.getElementById("error");
    var ok = document.getElementById("ok");
    document.getElementById("saveBtn").onclick = function () {
      err.style.display = "none";
      ok.style.display = "none";
      var cur = document.getElementById("current").value;
      var next = document.getElementById("next").value;
      var conf = document.getElementById("confirm").value;
      if (!cur) {
        err.textContent = "Enter your current password.";
        err.style.display = "block";
        return;
      }
      if (next.length < 8) {
        err.textContent = "New password must be at least 8 characters.";
        err.style.display = "block";
        return;
      }
      if (next !== conf) {
        err.textContent = "New password and confirm do not match.";
        err.style.display = "block";
        return;
      }
      ok.style.display = "block";
      setTimeout(function () { location.href = "profile.html"; }, 700);
    };
  </script>
</body>
</html>
