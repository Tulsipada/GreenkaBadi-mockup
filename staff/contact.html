<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Staff - Contact us - Green Kabadi</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/app-shell.css" />
  <link rel="stylesheet" href="../shared/components.css" />
</head>
<body>
  <div class="phone-stage">
    <div class="phone-frame">
      <div class="phone-notch">9:41</div>
      <div class="Screen">
        <header class="Header">
          <a class="HeaderBack" href="profile.html" aria-label="Back">&lsaquo;</a>
          <h1 class="HeaderTitle">Contact us</h1>
        </header>
        <div class="ScreenScroll stack">
          <div class="Card">
            <h3 style="margin:0 0 6px;">Staff operations support</h3>
            <p class="muted" style="margin:0;">Dispatch and ops usually reply within a few hours (9 AM - 8 PM IST).</p>
          </div>
          <div class="SettingsGroup" style="box-shadow:none;border:1px solid var(--gk-border);">
            <a class="SettingsRow" href="tel:+913340000000">
              <span aria-hidden="true">📞</span>
              <span class="grow">Call · +91 33 4000 0000</span>
              <span class="chev">›</span>
            </a>
            <a class="SettingsRow" href="mailto:ops@greenkabadi.in">
              <span aria-hidden="true">✉️</span>
              <span class="grow">Email · ops@greenkabadi.in</span>
              <span class="chev">›</span>
            </a>
          </div>
          <div class="Card">
            <strong style="font-size:13px;">Office</strong>
            <p class="muted" style="margin:6px 0 0;">Salt Lake, Kolkata, West Bengal</p>
          </div>
          <div class="Field">
            <label for="email">Your email</label>
            <input id="email" type="email" required placeholder="you@email.com" value="karim.collector@email.com" />
          </div>
          <div class="Field">
            <label for="msg">Message</label>
            <textarea id="msg" rows="4" placeholder="Job ID, issue, or question..."></textarea>
          </div>
          <p class="muted" id="sentNote" hidden style="color:var(--gk-green-700);font-weight:600;">Message sent. Admin can reply by email.</p>
          <button type="button" class="Btn Btn-primary Btn-block" id="sendBtn">Send message</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    document.getElementById("sendBtn").onclick = function () {
      var email = (document.getElementById("email").value || "").trim();
      var message = (document.getElementById("msg").value || "").trim();
      if (!email || !message) return;
      var list = [];
      try { list = JSON.parse(localStorage.getItem("gk_contact_messages") || "[]"); } catch (e) {}
      list.unshift({
        id: "c" + Date.now(),
        name: "Karim",
        email: email,
        role: "Staff",
        message: message,
        read: false,
        at: new Date().toLocaleString("en-IN", {
          day: "numeric", month: "short", year: "numeric",
          hour: "numeric", minute: "2-digit"
        })
      });
      try { localStorage.setItem("gk_contact_messages", JSON.stringify(list)); } catch (e2) {}
      document.getElementById("msg").value = "";
      document.getElementById("sentNote").hidden = false;
    };
  </script>
</body>
</html>
